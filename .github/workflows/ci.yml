name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt ".[postgres,orchestration]"
      - run: python -m unittest discover -v
      - name: Synthetic telemetry protocols over real loopback TLS
        run: python -m unittest discover -s telemetry_tests -v
      - run: python -m sre_suite.demo
      - run: python -m mypy sre_suite
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Verify installed package and catalog
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -m sre_suite.demo
          python -m sre_suite.execution.cli export-telemetry-plan --help
          python -m sre_suite.execution.cli preflight --help
          python -m sre_suite.execution.cli pilot-setup --help
          python -m sre_suite.local_pilot --help
          python -m sre_suite.pilot_demo --help
          python -m sre_suite.verification --help
          python -m sre_suite.verification.child --help
          python -m sre_suite.telemetry --help
          python -m sre_suite.telemetry.scheduling --help
          python -m sre_suite.telemetry.schedule_child --help
          python -m sre_suite.jira_planning --help
          python -m sre_suite.jira_planning handoff --help
          python -m sre_suite.local_pilot handoff --help
          python -c 'from sre_suite.pilot_demo.prepare import template; assert len(template()) == 6; assert "acceptance.py" in template()'
          python -c 'from sre_suite.certification import load_catalog; from sre_suite.api import EvidenceContextApi; assert len(load_catalog().checks) == 120; assert all(c.implemented for c in load_catalog().checks); assert len(EvidenceContextApi.ROUTES) == 3'

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            postgres: '16'
          - python: '3.14'
            postgres: '17'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: sre_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: sre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_test -d sre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SRE_TEST_POSTGRES_DSN: postgresql://sre_test:synthetic-test-only@127.0.0.1:5432/sre_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[postgres]"
      - name: Real PostgreSQL, authenticated API and HTTPS tests (no skips)
        run: python -m unittest discover -s integration_tests -v
      - name: Verify migrations are included in the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -c 'from sre_suite.postgres import migrations; assert [m.version for m in migrations()] == [1, 2]; assert all(m.source for m in migrations())'

  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[orchestration]"
      - run: docker pull python@sha256:65bd3d9f1d7fa268dd1909973ba7eb4bdf41f6dcf2cfbe76ba9528b170f3fd79
      - name: Real Temporal replay, recovery, cancellation and constrained container tests
        run: python -m unittest discover -s orchestration_tests -v

  local-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      SRE_TEST_POSTGRES_IMAGE: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[postgres,orchestration]"
      - run: docker pull "$SRE_TEST_POSTGRES_IMAGE"
      - name: Prepare SDK-compatible Temporal CLI for local acceptance
        run: |
          python - <<'PY'
          import asyncio, os
          from pathlib import Path
          from temporalio.testing import WorkflowEnvironment
          directory = Path(os.environ['RUNNER_TEMP']) / 'sre-local-temporal'
          directory.mkdir(mode=0o700)
          async def prepare():
              server = await WorkflowEnvironment.start_local(download_dest_dir=str(directory), ui=False)
              await server.shutdown()
          asyncio.run(prepare())
          binaries = [p for p in directory.iterdir() if p.is_file() and os.access(p, os.X_OK)]
          assert len(binaries) == 1
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SRE_TEST_TEMPORAL_BINARY=' + str(binaries[0]) + '\n')
          PY
      - name: Real local startup, TLS, worker readiness and persistent restart
        run: python -m unittest discover -s local_pilot_tests -v
