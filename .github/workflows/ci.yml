name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt ".[postgres]"
      - run: python -m unittest discover -v
      - run: python -m sre_suite.demo
      - run: python -m mypy sre_suite
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Verify installed package and catalog
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -m sre_suite.demo
          python -c 'from sre_suite.certification import load_catalog; from sre_suite.api import EvidenceContextApi; assert len(load_catalog().checks) == 120; assert len(EvidenceContextApi.ROUTES) == 3'

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            postgres: '16'
          - python: '3.14'
            postgres: '17'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: sre_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: sre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_test -d sre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SRE_TEST_POSTGRES_DSN: postgresql://sre_test:synthetic-test-only@127.0.0.1:5432/sre_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[postgres]"
      - name: Real PostgreSQL, authenticated API and HTTPS tests (no skips)
        run: python -m unittest discover -s integration_tests -v
      - name: Verify migrations are included in the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -c 'from sre_suite.postgres import migrations; assert [m.version for m in migrations()] == [1, 2]; assert all(m.source for m in migrations())'
