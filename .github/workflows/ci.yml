name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - run: python -m sre_suite.demo
      - run: python -m mypy sre_suite
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Verify installed package and catalog
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -m sre_suite.demo
          python -c 'from sre_suite.certification import load_catalog; assert len(load_catalog().checks) == 120'
